<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Supreme AI Matrix - Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --c-primary: #10b981;
      --c-bg: #070d17;
      --c-surface: #111a2d;
      --c-surface-elevated: #1a263f;
      --c-border: #1f2d4a;
      --c-text: #f8fafc;
      --c-muted: #8492a6;
      --c-danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--c-bg); color: var(--c-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: rgba(17,26,45,0.95); padding: 12px 16px; border-bottom: 1px solid var(--c-border); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
    .logo { font-weight: 900; font-size: 16px; color: var(--c-primary); display: flex; align-items: center; gap: 6px; }

    .nav-tabs { display: flex; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 3px; gap: 4px; }
    .tab-btn { background: transparent; border: none; color: var(--c-muted); padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 6px; transition: 0.2s; }
    .tab-btn.active { background: var(--c-primary); color: #fff; }

    .view-section { flex: 1; display: none; flex-direction: column; padding: 16px; overflow-y: auto; gap: 14px; padding-bottom: 80px; }
    .view-section.active { display: flex; }

    /* شات جيميناي المصغر */
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
    .message { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .message.user { background: var(--c-primary); color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
    .message.ai { background: var(--c-surface-elevated); border: 1px solid var(--c-border); align-self: flex-start; border-bottom-right-radius: 4px; }
    
    .chat-input-box { display: flex; gap: 8px; background: var(--c-surface); padding: 10px; border-radius: 12px; border: 1px solid var(--c-border); }
    .chat-input-box textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 13px; resize: none; max-height: 80px; }
    .send-btn { background: var(--c-primary); color: #fff; border: none; width: 40px; height: 40px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }

    /* محرر الصور */
    .preview-box { width: 100%; height: 240px; background: var(--c-surface); border: 2px dashed var(--c-border); border-radius: 14px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .placeholder { color: var(--c-muted); font-size: 13px; text-align: center; position: absolute; }
    
    .card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 14px; padding: 14px; }
    textarea.full-input { width: 100%; padding: 12px; background: rgba(7,13,23,0.8); border: 1px solid var(--c-border); color: #fff; border-radius: 8px; outline: none; font-size: 13px; resize: none; margin-top: 6px; }
    textarea.full-input:focus { border-color: var(--c-primary); }

    .btn { background: var(--c-primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; text-align: center; }
    .btn:active { transform: scale(0.97); }
    .file-input { display: none; }

    .loading-overlay { position: absolute; inset: 0; background: rgba(7,13,23,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; gap: 10px; z-index: 10; font-weight: bold; color: var(--c-primary); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--c-border); border-top-color: var(--c-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Supreme AI</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="App.switchTab('chat', this)">الدردشة الحرة</button>
      <button class="tab-btn" onclick="App.switchTab('editor', this)">تعديل الصور</button>
    </div>
  </header>

  <!-- قسم الشات (جيميناي المصغر) -->
  <section id="view-chat" class="view-section active">
    <div class="chat-container" id="chat-feed">
      <div class="message ai">أهلاً بك يا شريك. أنا جاهز للدردشة، التحليل، أو الإجابة على أي سؤال بلا قيود. تفضل!</div>
    </div>
    <div class="chat-input-box">
      <textarea id="chat-input" rows="1" placeholder="اكتب رسالتك أو سؤالك هنا..."></textarea>
      <button class="send-btn" onclick="App.sendChatMessage()">➤</button>
    </div>
  </section>

  <!-- قسم تعديل الصور -->
  <section id="view-editor" class="view-section">
    <div class="preview-box" id="drop-zone" onclick="document.getElementById('upload-input').click()">
      <div class="placeholder" id="placeholder">📸 اضغط هنا لرفع الصورة (لحذف قبعة، تعديل، إلخ)</div>
      <img id="preview-img" class="hidden">
      <div class="loading-overlay" id="loading-box">
        <div class="spinner"></div>
        <span id="loading-text">جاري معالجة الصورة بالذكاء الاصطناعي...</span>
      </div>
    </div>
    <input type="file" id="upload-input" class="file-input" accept="image/*" onclick="this.value=null" onchange="App.handleImage(event)">

    <div class="card">
      <label style="font-size: 12px; color: var(--c-muted); font-weight: 600;">أمر التعديل (Prompt) باللغة الإنجليزية:</label>
      <textarea id="prompt-input" class="full-input" rows="3" placeholder="مثال: Remove the hat and show natural hair, highly detailed..."></textarea>
      <button class="btn" onclick="App.processImage()">⚡ تنفيذ التعديل السحري</button>
    </div>
  </section>

  <script>
    const CONFIG = {
      HF_TOKEN: "Hf_atElRfVaRuWHMCqaGbsnGLUvTjOqhrdnrL" // التوكن الخاص بك مدمج مباشرة
    };

    const App = {
      imageBase64: null,

      init() {
        const tg = window.Telegram?.WebApp;
        if(tg) { try { tg.expand(); tg.ready(); } catch(e){} }
      },

      switchTab(tabName, btn) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${tabName}`).classList.add('active');
        btn.classList.add('active');
      },

      // منطق الدردشة (جيميناي المصغر عبر Hugging Face Llama)
      async sendChatMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        const feed = document.getElementById('chat-feed');
        feed.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        feed.scrollTop = feed.scrollHeight;

        const aiMsgId = 'ai_' + Date.now();
        feed.innerHTML += `<div class="message ai" id="${aiMsgId}">جاري التفكير...</div>`;
        feed.scrollTop = feed.scrollHeight;

        try {
          const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Llama-3.1-8B-Instruct/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${CONFIG.HF_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "meta-llama/Llama-3.1-8B-Instruct",
              messages: [{ role: "user", content: text }],
              max_tokens: 500,
              stream: false
            })
          });

          const data = await response.json();
          const reply = data.choices && data.choices[0] ? data.choices[0].message.content : "عذراً، حدث خطأ في الرد.";
          document.getElementById(aiMsgId).innerText = reply;
        } catch (err) {
          document.getElementById(aiMsgId).innerText = "حدث خطأ في الاتصال بالسحابة.";
        }
        feed.scrollTop = feed.scrollHeight;
      },

      // رفع الصورة
      handleImage(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          this.imageBase64 = e.target.result;
          const img = document.getElementById('preview-img');
          img.src = this.imageBase64;
          img.classList.remove('hidden');
          document.getElementById('placeholder').style.display = 'none';
        }
        reader.readAsDataURL(file);
      },

      // معالجة الصور (Inpainting / تعديل)
      async processImage() {
        const prompt = document.getElementById('prompt-input').value.trim();
        if(!prompt) { alert('اكتب أمر التعديل أولاً!'); return; }
        if(!this.imageBase64) { alert('رفع الصورة مطلوب أولاً!'); return; }

        const loadingBox = document.getElementById('loading-box');
        const loadingText = document.getElementById('loading-text');
        loadingBox.style.display = 'flex';
        loadingText.innerText = "جاري معالجة الصورة بالسحابة...";

        try {
          // استخدام نموذج Stable Diffusion Inpainting لتعديل أو حذف العناصر
          const response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-inpainting", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${CONFIG.HF_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              inputs: prompt
            })
          });

          if (!response.ok) throw new Error("فشل الطلب من السحابة");

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          
          const img = document.getElementById('preview-img');
          img.src = url;
          alert('تم تعديل الصورة بنجاح!');
        } catch (err) {
          console.error(err);
          alert('تعذر إتمام التعديل حالياً. تأكد من صحة البيانات أو جرب نموذجاً آخر.');
        } finally {
          loadingBox.style.display = 'none';
        }
      }
    };

    window.onload = () => App.init();
  </script>
</body>
</html>
