<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dollar C - Part 1</title>
  
  <style>
    /* ================= 1. التصميم والألوان الأساسية ================= */
    :root {
      --c-primary: #10b981; 
      --c-primary-dark: #059669;
      --c-bg: #0f172a;
      --c-card: #1e293b;
      --c-text: #f8fafc;
      --c-muted: #94a3b8;
      --c-danger: #ef4444;
      --c-warn: #f59e0b;
      --c-border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--c-bg); color: var(--c-text); padding-bottom: 80px; overflow-x: hidden; }
    
    /* الفئات المساعدة */
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .text-center { text-align: center; }
    
    /* الشريط العلوي */
    .header { padding: 16px; background: var(--c-card); border-bottom: 1px solid var(--c-border); position: sticky; top: 0; z-index: 50; }
    
    /* الشاشات (Views) */
    .view-section { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* الكروت والأزرار */
    .card { background: var(--c-card); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--c-border); }
    .btn { background: var(--c-primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
    
    /* شريط التنقل السفلي */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(30, 41, 59, 0.95); border-top: 1px solid var(--c-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--c-muted); display: flex; flex-direction: column; align-items: center; font-size: 12px; gap: 4px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { color: var(--c-primary); }
  </style>
</head>
<body>

  <!-- ================= 2. هيكل الصفحات (HTML) ================= -->
  
  <header class="header flex-between">
    <div>Dollar C Platform</div>
    <button style="padding: 5px 10px; background: transparent; color: var(--c-primary); border: 1px solid var(--c-primary); border-radius: 5px;" id="lang-btn">عربي</button>
  </header>

  <!-- شاشة المهام -->
  <main id="view-earn" class="view-section active">
    <div class="card text-center" style="background: linear-gradient(135deg, #064e3b, var(--c-primary-dark));">
      <p>Available Balance</p>
      <h1 style="font-size: 40px; margin: 10px 0;">0.00 ₵</h1>
    </div>
    <div class="card"><h3>Tasks (Coming in Part 3)</h3></div>
  </main>

  <!-- شاشة الإعلانات -->
  <main id="view-ads" class="view-section">
    <div class="card">
      <h3 style="color: var(--c-primary);">Create Advertisement</h3>
      <p class="text-muted" style="margin-top: 10px; font-size: 14px;">Publish tasks for users to complete.</p>
    </div>
  </main>

  <!-- شاشة المحفظة -->
  <main id="view-wallet" class="view-section">
    <div class="card text-center">
      <h3>Wallet</h3>
      <button class="btn">Deposit</button>
      <button class="btn" style="background: var(--c-danger);">Withdraw</button>
    </div>
  </main>

  <!-- شاشة الحساب -->
  <main id="view-profile" class="view-section">
    <div class="card">
      <h3>Profile & Affiliate</h3>
      <p class="text-muted">Invite friends and earn 35%.</p>
    </div>
  </main>

  <!-- شاشة الإدارة (مخفية مؤقتاً برمجياً) -->
  <main id="view-admin" class="view-section">
    <div class="card" style="border-color: var(--c-danger);">
      <h3 style="color: var(--c-danger);">Admin Panel - God Mode</h3>
      <p>Control users and funds.</p>
    </div>
  </main>

  <!-- ================= 3. أزرار التنقل السفلية ================= -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('view-earn', this)">Earn</button>
    <button class="nav-btn" onclick="switchTab('view-ads', this)">Ads</button>
    <button class="nav-btn" onclick="switchTab('view-wallet', this)">Wallet</button>
    <button class="nav-btn" onclick="switchTab('view-profile', this)">Profile</button>
    <button class="nav-btn" onclick="switchTab('view-admin', this)">Admin</button>
  </nav>

  <!-- ================= 4. العقل المدبر الأساسي (JS) ================= -->
  <script>
    // دالة واحدة فقط ومحمية لضمان عمل الأزرار دون تعليق
    function switchTab(viewId, btnEl) {
      // إخفاء كل الشاشات
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      // إزالة اللون من كل الأزرار
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      // إظهار الشاشة المطلوبة والزر المضغوط
      document.getElementById(viewId).classList.add('active');
      btnEl.classList.add('active');
    }
  </script>
</body>
</html>
